<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Radar Hujan Jabodetabek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: peta layar penuh, kartu judul kecil di kiri atas, panel kendali melayang di bawah.
   Palet: latar biru-abu gelap supaya warna radar menonjol, ambar sebagai penanda waktu. */
:root {
  --bg: #EDF1F4;
  --panel: #FFFFFF;
  --fg: #13202B;
  --muted: #566774;
  --line: #D3DCE3;
  --chip: #E4EBF0;
  --accent: #B25E00;
  --accent-fg: #FFFFFF;
  --shadow: 0 6px 24px rgba(19, 32, 43, .18);
  --font-ui: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D1318;
    --panel: #141C23;
    --fg: #E5ECF1;
    --muted: #8EA0AD;
    --line: #26323B;
    --chip: #1D2831;
    --accent: #F2B84B;
    --accent-fg: #1A1200;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font-ui); overflow: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-container { font-family: var(--font-ui); background: var(--bg); }
@media (prefers-color-scheme: dark) {
  .leaflet-tile-pane, .leaflet-labels-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.92); }
}
.leaflet-top.leaflet-right { margin-top: env(safe-area-inset-top, 0px); margin-right: env(safe-area-inset-right, 0px); }
.leaflet-bar { border: 1px solid var(--line); box-shadow: var(--shadow); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--fg); border-bottom-color: var(--line); }
.leaflet-bar a:hover { background: var(--chip); }

.card {
  background: var(--panel);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.title {
  position: fixed; z-index: 1000;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px));
  max-width: calc(100% - 96px);
  padding: 8px 12px;
  border-radius: 12px;
  display: grid; gap: 2px;
}
.title b { font-weight: 600; font-size: 14px; }
.title span { font-size: 12px; color: var(--muted); }

.panel {
  position: fixed; z-index: 1000;
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: max(12px, env(safe-area-inset-bottom, 0px));
  max-width: 560px; margin-inline: auto;
  padding: 14px 16px 12px;
  border-radius: 16px;
  display: grid; gap: 10px;
}

.readout { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.time { font: 600 26px/1 var(--font-mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.time small { font: 500 12px var(--font-ui); color: var(--muted); margin-left: 6px; letter-spacing: .06em; }
.rel { color: var(--muted); margin-top: 6px; font-size: 13px; }
.state {
  flex: none; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px; background: var(--chip); color: var(--muted);
}
.state[data-kind="now"] { background: var(--accent); color: var(--accent-fg); }
.state[data-kind="forecast"] { background: transparent; color: var(--fg); outline: 1px dashed var(--accent); outline-offset: -1px; }

.notice { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--chip); font-size: 13px; }

.scrubrow { display: flex; align-items: flex-start; gap: 12px; }
.play {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); display: grid; place-items: center;
}
.scrub { position: relative; flex: 1; min-width: 0; }
input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; margin: 8px 0 0; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; box-sizing: border-box; width: 18px; height: 18px; margin-top: -7px;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line);
}
input[type=range]::-moz-range-thumb {
  box-sizing: border-box; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line);
}
.scale { position: relative; height: 16px; margin-top: -4px; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.scale span { position: absolute; top: 0; white-space: nowrap; }
#startLbl { left: 0; }
#nowLbl { left: calc(9px + (100% - 18px) * var(--p, 1)); transform: translateX(-50%); }
#nowLbl.end { left: auto; right: 0; transform: none; }
#endLbl { right: 0; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  min-height: 38px; padding: 0 14px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg); font: 500 13px var(--font-ui);
}
.btn:hover { background: var(--chip); }
.btn[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }

.credit { margin: 0; font-size: 11px; line-height: 1.5; color: var(--muted); }
.credit a { color: inherit; text-decoration-color: var(--muted); }
</style>
</head>
<body>

<div id="map" aria-label="Peta radar hujan Jabodetabek"></div>

<header class="card title">
  <b>Radar hujan Jabodetabek</b>
  <span id="updated">Memuat data…</span>
</header>

<section class="card panel" id="panel" aria-label="Kontrol animasi radar">
  <div class="readout">
    <div>
      <div class="time"><span id="clock">--:--</span><small>WIB</small></div>
      <div class="rel" id="rel">Memuat frame radar…</div>
    </div>
    <span class="state" id="state" data-kind="past">—</span>
  </div>

  <p class="notice" id="notice" role="status" hidden></p>

  <div class="scrubrow">
    <button id="play" class="play" type="button" aria-label="Putar animasi"></button>
    <div class="scrub">
      <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Pilih waktu radar">
      <div class="scale" id="scale">
        <span id="startLbl"></span><span id="nowLbl">sekarang</span><span id="endLbl" hidden></span>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="locate" class="btn" type="button">Lokasiku</button>
    <button id="coverage" class="btn" type="button" aria-pressed="false">Cakupan radar</button>
    <button id="source" class="btn" type="button">Data: LibreWXR</button>
    <button id="basemap" class="btn" type="button">Peta: Esri</button>
    <button id="refresh" class="btn" type="button">Segarkan</button>
  </div>

  <p class="credit">
    <span id="dataCredit"></span> ·
    Peta: <span id="mapCredit"></span> ·
    <a href="https://www.rainviewer.com/api/color-schemes.html" target="_blank" rel="noopener">Legenda warna</a>
  </p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  'use strict';

  // Sumber data. RainViewer tidak punya radar untuk Jabodetabek. LibreWXR mengisi wilayah tanpa radar
  // dengan estimasi hujan dari satelit (NOAA RRQPE, grid sekitar 4 km, update tiap 10 menit).
  const SOURCES = {
    librewxr: {
      name: 'LibreWXR',
      kind: 'Estimasi satelit',
      api: 'https://api.librewxr.net/public/weather-maps.json',
      coverage: false,
      credit: 'Hujan: <a href="https://github.com/JoshuaKimsey/LibreWXR" target="_blank" rel="noopener">LibreWXR</a> (CC BY 4.0), Precipitation data from NOAA Enterprise Rain Rate (RRQPE)'
    },
    rainviewer: {
      name: 'RainViewer',
      kind: 'Radar',
      api: 'https://api.rainviewer.com/public/weather-maps.json',
      coverage: true,
      credit: 'Data radar oleh <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a>'
    }
  };
  let sourceKey = 'librewxr';
  try {
    const savedSource = localStorage.getItem('source');
    if (savedSource && Object.hasOwn(SOURCES, savedSource)) sourceKey = savedSource;
  } catch (_) { /* penyimpanan tidak tersedia */ }
  const TILE_SIZE = 256;
  const MAX_NATIVE_ZOOM = 7;      // batas zoom tile RainViewer; di atas ini tile diperbesar
  const MAP_MAX_ZOOM = 12;
  const COLOR = 2;                // skema "Universal Blue"
  const OPTIONS = '1_0';          // smooth=1, snow=0
  const RADAR_OPACITY = 0.78;
  const FRAME_MS = 650;
  const HOLD_MS = 1600;
  const REFRESH_MS = 5 * 60 * 1000;
  const BOUNDS = L.latLngBounds([-6.75, 106.40], [-5.98, 107.25]);   // Jabodetabek

  const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';
  const STATE_TEXT = { now: 'Terkini', past: 'Lampau', forecast: 'Prakiraan' };

  const $ = (id) => document.getElementById(id);
  const clockEl = $('clock'), relEl = $('rel'), stateEl = $('state'), noticeEl = $('notice');
  const updatedEl = $('updated'), scrub = $('scrub'), scale = $('scale');
  const startLbl = $('startLbl'), nowLbl = $('nowLbl'), endLbl = $('endLbl');
  const playBtn = $('play'), locateBtn = $('locate'), covBtn = $('coverage'), refreshBtn = $('refresh'), basemapBtn = $('basemap'), sourceBtn = $('source');
  const panel = $('panel');

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timeFmt = new Intl.DateTimeFormat('en-GB', {
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Asia/Jakarta'
  });
  const fmtClock = (sec) => timeFmt.format(new Date(sec * 1000));
  const fmtSpan = (min) => (min % 60 === 0 ? `${min / 60} j` : `${min} mnt`);

  /* ---------- Peta dan lapisan dasar ---------- */
  const map = L.map('map', { zoomControl: false, attributionControl: false, minZoom: 7, maxZoom: MAP_MAX_ZOOM, zoomSnap: 0.5 });
  L.control.zoom({ position: 'topright' }).addTo(map);
  map.createPane('radar').style.zIndex = 250;
  map.createPane('coverage').style.zIndex = 260;
  const labelsPane = map.createPane('labels');
  labelsPane.style.zIndex = 450;
  labelsPane.style.pointerEvents = 'none';

  // Peta dasar tanpa API key (tile CARTO sekarang butuh key). Mode gelap memakai filter CSS pada pane ini.
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas';
  const OSM_LINK = '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
  const BASEMAPS = {
    esri: {
      name: 'Esri',
      credit: 'Tiles © <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, © ' + OSM_LINK + ' contributors',
      make: () => [
        L.tileLayer(`${ESRI}/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`, { pane: 'tilePane', maxNativeZoom: 16, maxZoom: MAP_MAX_ZOOM }),
        L.tileLayer(`${ESRI}/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, { pane: 'labels', maxNativeZoom: 16, maxZoom: MAP_MAX_ZOOM })   // nama kota di atas radar
      ]
    },
    osm: {
      name: 'OpenStreetMap',
      credit: '© ' + OSM_LINK + ' contributors',
      make: () => [
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { pane: 'tilePane', maxNativeZoom: 19, maxZoom: MAP_MAX_ZOOM })
      ]
    }
  };
  let baseKey = 'esri';
  let baseLayers = [];
  try {
    const saved = localStorage.getItem('basemap');
    if (saved && Object.hasOwn(BASEMAPS, saved)) baseKey = saved;
  } catch (_) { /* penyimpanan tidak tersedia */ }

  function applyBasemap() {
    baseLayers.forEach((l) => l.remove());
    baseLayers = BASEMAPS[baseKey].make().map((l) => l.addTo(map));
    $('mapCredit').innerHTML = BASEMAPS[baseKey].credit;
    basemapBtn.textContent = `Peta: ${BASEMAPS[baseKey].name}`;
  }
  basemapBtn.addEventListener('click', () => {
    baseKey = baseKey === 'esri' ? 'osm' : 'esri';
    try { localStorage.setItem('basemap', baseKey); } catch (_) { /* abaikan */ }
    applyBasemap();
    notice(baseKey === 'osm'
      ? 'Jika peta kosong atau muncul tulisan "Referer is required", buka file ini lewat alamat http (hosting atau localhost), bukan langsung dari file.'
      : 'Jika peta kosong atau berwatermark, tekan lagi untuk ganti sumber peta.', 8000);
  });
  applyBasemap();

  map.fitBounds(BOUNDS, {
    paddingTopLeft: [12, 64],
    paddingBottomRight: [12, panel.offsetHeight + 24],
    animate: false
  });

  /* ---------- Frame radar ---------- */
  let host = '';
  let frames = [];      // { time, path, kind: 'past' | 'forecast', layer }
  let idx = 0;
  let nowIdx = 0;
  let playing = false;
  let timer = 0;
  let firstLoad = true;

  const makeLayer = (f) => L.tileLayer(
    `${host}${f.path}/${TILE_SIZE}/{z}/{x}/{y}/${COLOR}/${OPTIONS}.png`,
    { pane: 'radar', opacity: 0, tileSize: TILE_SIZE, maxNativeZoom: MAX_NATIVE_ZOOM, maxZoom: MAP_MAX_ZOOM, keepBuffer: 2 }
  );

  function applyData(data) {
    const past = (data.radar?.past ?? []).map((f) => ({ time: f.time, path: f.path, kind: 'past' }));
    const ahead = (data.radar?.nowcast ?? []).map((f) => ({ time: f.time, path: f.path, kind: 'forecast' }));
    if (!past.length || !data.host) throw new Error('Data radar kosong');

    if (data.host !== host) {                       // host berubah: semua layer lama tidak valid
      frames.forEach((f) => f.layer.remove());
      frames = [];
      host = data.host;
    }
    const following = !frames.length || idx === nowIdx;
    const currentPath = frames[idx]?.path;
    const old = new Map(frames.map((f) => [f.path, f]));
    const next = [...past, ...ahead];

    for (const f of next) {
      const prev = old.get(f.path);
      if (prev) { f.layer = prev.layer; old.delete(f.path); }
      else { f.layer = makeLayer(f).addTo(map); }
    }
    for (const f of old.values()) f.layer.remove();

    frames = next;
    nowIdx = past.length - 1;
    const keep = frames.findIndex((f) => f.path === currentPath);
    scrub.max = String(frames.length - 1);
    updateScale();
    show(following || keep < 0 ? nowIdx : keep);
    updatedEl.textContent = `${SOURCES[sourceKey].kind} · terakhir ${fmtClock(frames[nowIdx].time)} WIB`;
  }

  function updateScale() {
    const span = frames.length - 1;
    scale.style.setProperty('--p', String(span ? nowIdx / span : 1));
    nowLbl.classList.toggle('end', span === 0 || nowIdx / span > 0.94);
    const back = Math.round((frames[nowIdx].time - frames[0].time) / 60);
    startLbl.hidden = back <= 0;
    startLbl.textContent = back > 0 ? `−${fmtSpan(back)}` : '';
    const fwd = Math.round((frames[frames.length - 1].time - frames[nowIdx].time) / 60);
    endLbl.hidden = fwd <= 0;
    endLbl.textContent = fwd > 0 ? `+${fmtSpan(fwd)}` : '';
  }

  function relLabel(f) {
    const mins = Math.round((Date.now() - f.time * 1000) / 60000);
    if (mins < 0) return `+${-mins} mnt dari sekarang`;
    if (mins < 1) return 'baru saja';
    if (mins < 60) return `${mins} mnt lalu`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `${h} j ${m} mnt lalu` : `${h} j lalu`;
  }

  function render(f) {
    clockEl.textContent = fmtClock(f.time);
    relEl.textContent = relLabel(f);
    const kind = f.kind === 'forecast' ? 'forecast' : (idx === nowIdx ? 'now' : 'past');
    stateEl.dataset.kind = kind;
    stateEl.textContent = STATE_TEXT[kind];
  }

  function show(i) {
    idx = i;
    frames.forEach((f, k) => f.layer.setOpacity(k === i ? RADAR_OPACITY : 0));
    scrub.value = String(i);
    render(frames[i]);
  }

  /* ---------- Animasi ---------- */
  function schedule() {
    clearTimeout(timer);
    if (!playing || frames.length < 2) return;
    const hold = idx === nowIdx || idx === frames.length - 1;
    timer = setTimeout(() => { show((idx + 1) % frames.length); schedule(); }, hold ? HOLD_MS : FRAME_MS);
  }
  function setPlaying(on) {
    playing = on;
    clearTimeout(timer);
    playBtn.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute('aria-label', on ? 'Jeda animasi' : 'Putar animasi');
    if (on) schedule();
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => { setPlaying(false); if (frames.length) show(Number(scrub.value)); });
  setPlaying(false);

  /* ---------- Pesan ---------- */
  let noticeTimer = 0;
  function notice(msg, ms) {
    clearTimeout(noticeTimer);
    noticeEl.hidden = !msg;
    noticeEl.textContent = msg || '';
    if (msg && ms) noticeTimer = setTimeout(() => { noticeEl.hidden = true; }, ms);
  }

  /* ---------- Ambil data ---------- */
  let lastFetch = 0, loadSeq = 0;
  async function load() {
    const seq = ++loadSeq;
    const src = SOURCES[sourceKey];
    refreshBtn.disabled = true;
    try {
      const res = await fetch(src.api, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (seq !== loadSeq) return;            // sumber diganti selagi menunggu
      applyData(data);
      lastFetch = Date.now();
      notice(null);
      if (firstLoad) {
        firstLoad = false;
        if (!reducedMotion) setPlaying(true);
      }
    } catch (err) {
      if (seq !== loadSeq) return;
      console.error(err);
      notice(frames.length
        ? 'Gagal menyegarkan, menampilkan data terakhir. Coba lagi nanti.'
        : `Data dari ${src.name} tidak bisa diambil. Cek koneksi internet, tekan Segarkan, atau coba ganti sumber data.`);
    } finally {
      if (seq === loadSeq) refreshBtn.disabled = false;
    }
  }
  refreshBtn.addEventListener('click', load);

  /* ---------- Ganti sumber data ---------- */
  function renderSource() {
    const src = SOURCES[sourceKey];
    sourceBtn.textContent = `Data: ${src.name}`;
    covBtn.hidden = !src.coverage;
    $('dataCredit').innerHTML = src.credit;
  }
  function clearFrames() {
    setPlaying(false);
    frames.forEach((f) => f.layer.remove());
    frames = [];
    host = '';
    idx = 0;
    nowIdx = 0;
    firstLoad = true;
    scrub.max = '0';
    scrub.value = '0';
    clockEl.textContent = '--:--';
    relEl.textContent = 'Memuat frame…';
    stateEl.dataset.kind = 'past';
    stateEl.textContent = '—';
    startLbl.hidden = true;
    endLbl.hidden = true;
    updatedEl.textContent = 'Memuat data…';
    if (coverage) { coverage.remove(); coverage = null; }
    covBtn.setAttribute('aria-pressed', 'false');
  }
  sourceBtn.addEventListener('click', async () => {
    sourceKey = sourceKey === 'librewxr' ? 'rainviewer' : 'librewxr';
    try { localStorage.setItem('source', sourceKey); } catch (_) { /* abaikan */ }
    clearFrames();
    renderSource();
    await load();
    if (!frames.length) return;
    notice(sourceKey === 'librewxr'
      ? 'LibreWXR memakai estimasi hujan dari satelit (grid sekitar 4 km), bukan radar. Detail lokal bisa meleset.'
      : 'RainViewer belum punya radar untuk Jabodetabek, jadi area ini mungkin kosong.', 8000);
  });
  setInterval(load, REFRESH_MS);
  setInterval(() => { if (frames[idx]) render(frames[idx]); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() - lastFetch > REFRESH_MS) load();
  });

  /* ---------- Cakupan radar ---------- */
  let coverage = null;
  covBtn.addEventListener('click', () => {
    const on = covBtn.getAttribute('aria-pressed') !== 'true';
    if (on && !host) { notice('Data radar belum dimuat.', 4000); return; }
    covBtn.setAttribute('aria-pressed', String(on));
    if (coverage) { coverage.remove(); coverage = null; }
    if (on) {
      coverage = L.tileLayer(`${host}/v2/coverage/0/${TILE_SIZE}/{z}/{x}/{y}/0/0_0.png`, {
        pane: 'coverage', opacity: 0.5, tileSize: TILE_SIZE, maxNativeZoom: MAX_NATIVE_ZOOM, maxZoom: MAP_MAX_ZOOM
      }).addTo(map);
      notice('Area gelap berarti belum tercakup radar, area terang tercakup.', 7000);
    }
  });

  /* ---------- Lokasiku ---------- */
  let me = null;
  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) { notice('Browser ini tidak mendukung lokasi.', 5000); return; }
    locateBtn.disabled = true;
    navigator.geolocation.getCurrentPosition((pos) => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#F2B84B';
      if (me) me.remove();
      me = L.circleMarker(ll, { radius: 8, weight: 3, color: '#ffffff', fillColor: accent, fillOpacity: 1 }).addTo(map);
      map.flyTo(ll, Math.max(map.getZoom(), 11), { duration: 0.8 });
      locateBtn.disabled = false;
    }, () => {
      notice('Lokasi tidak bisa diakses. Izinkan akses lokasi untuk halaman ini di browser.', 6000);
      locateBtn.disabled = false;
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });

  renderSource();
  load();
})();
</script>
</body>
</html>
